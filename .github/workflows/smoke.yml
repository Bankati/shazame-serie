# Test de fumée après chaque déploiement Vercel réussi (préproduction, production, prévisualisations).
# Le résultat s'affiche sur le commit déployé, donc sur la PR qui le contient.
name: Smoke test

on:
  deployment_status:

permissions: {}

jobs:
  health:
    name: Santé du déploiement
    # Seulement les déploiements Vercel. Un job GitHub lié à un environnement (ex. « production » du
    # workflow de migration) crée lui aussi un « déploiement », dont l'adresse est la page du workflow sur
    # github.com : il n'y a rien à tester et le secret Vercel ne doit pas y être envoyé (incident du
    # 20 octobre 2026, « Domaine de déploiement non autorisé : github.com »).
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.creator.login != 'github-actions[bot]' &&
      !startsWith(github.event.deployment_status.target_url, 'https://github.com/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appeler /api/health
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          ENVIRONMENT: ${{ github.event.deployment.environment }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Domaines personnalisés autorisés, séparés par des espaces (variable de dépôt GitHub, facultative).
          ALLOWED_DEPLOYMENT_HOSTS: ${{ vars.ALLOWED_DEPLOYMENT_HOSTS }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::URL du déploiement absente de l'événement."
            exit 1
          fi
          if [ -z "$BYPASS_SECRET" ]; then
            echo "::error::Secret VERCEL_AUTOMATION_BYPASS_SECRET absent (GitHub → Settings → Secrets and variables → Actions). Voir docs/setup-deploiement.md, étape 2.7."
            exit 1
          fi
          # Le secret de contournement n'est envoyé qu'à un domaine Vercel (ou à un domaine listé dans ALLOWED_DEPLOYMENT_HOSTS).
          if ! printf '%s' "$DEPLOYMENT_URL" | grep -Eq '^https://[^/:]+(/|$)'; then
            echo "::error::URL de déploiement refusée (https obligatoire)."
            exit 1
          fi
          host=$(printf '%s' "$DEPLOYMENT_URL" | sed -E 's#^https://([^/:]+).*#\1#')
          if ! printf '%s' "$host" | grep -Eq '^[a-z0-9-]+\.vercel\.app$' && ! printf ' %s ' "$ALLOWED_DEPLOYMENT_HOSTS" | grep -Fq " $host "; then
            echo "::error::Domaine de déploiement non autorisé : $host"
            exit 1
          fi
          echo "Environnement : $ENVIRONMENT — $DEPLOYMENT_URL"
          body=$(curl --silent --show-error --fail --retry 5 --retry-delay 10 --retry-all-errors --max-time 20 \
            -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
            "${DEPLOYMENT_URL%/}/api/health")
          echo "$body"
          if printf '%s' "$body" | grep -q "Vercel Authentication"; then
            echo "::error::Page de connexion Vercel reçue : le secret VERCEL_AUTOMATION_BYPASS_SECRET de GitHub ne correspond pas à celui de Vercel (Settings → Deployment Protection → Protection Bypass for Automation)."
            exit 1
          fi
          if [ "$body" != '{"ok":true,"data":{"status":"ok"}}' ]; then
            echo "::error::Réponse inattendue de /api/health."
            exit 1
          fi
          # Compteur de quota : touche la base ET Redis. Échoue si DATABASE_URL ou Upstash sont mal réglés
          # sur ce déploiement (incident du 20 octobre 2026 : mot de passe de la base périmé dans Vercel).
          # Trois essais espacés (démarrage à froid) ; jamais d'arrêt brutal de curl : on veut le code HTTP.
          quota_status=000
          for attempt in 1 2 3; do
            quota_status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20               -H "x-vercel-protection-bypass: $BYPASS_SECRET" "${DEPLOYMENT_URL%/}/api/quota" || true)
            [ "$quota_status" = "200" ] && break
            sleep 5
          done
          if [ "$quota_status" != "200" ]; then
            echo "::error::/api/quota répond $quota_status : base de données ou Redis injoignable sur ce déploiement (vérifier DATABASE_URL et UPSTASH_* dans Vercel, puis /api/health/deep)."
            exit 1
          fi
          echo "Quota : OK (base et Redis joignables)."
          # Lecture de secours des vidéos (U33) : ffmpeg.wasm copié dans public/ffmpeg/ par le postinstall. Sans
          # ces fichiers, le secours échoue pour tout le monde. Versions alignées sur
          # src/client/frames/ffmpeg-source.ts (vérifié par ffmpeg-source.test.ts).
          for path in ffmpeg/core-0.12.10/ffmpeg-core.wasm ffmpeg/core-0.12.10/ffmpeg-core.js ffmpeg/worker-0.12.15/index.js ffmpeg/worker-0.12.15/worker.js; do
            status=$(curl --silent --head --output /dev/null --write-out '%{http_code}' --max-time 20 \
              -H "x-vercel-protection-bypass: $BYPASS_SECRET" "${DEPLOYMENT_URL%/}/$path" || true)
            if [ "$status" != "200" ]; then
              echo "::error::/$path répond $status : lecture de secours des vidéos indisponible (copie du postinstall absente du build ?)."
              exit 1
            fi
          done
          echo "Lecture de secours : OK (fichiers ffmpeg.wasm servis)."
